name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner ships an Android SDK, but not necessarily the platform this
      # project compiles against, and the tooling for installing one changed shape
      # in 2026: `android sdk install` replaced `sdkmanager`. Support both, and fail
      # with a clear message rather than a confusing Gradle error.
      - name: Ensure the Android SDK has what the build needs
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK root: $SDK"

          if [ -d "$SDK/platforms/android-36" ]; then
            echo "platforms/android-36 is already installed"
            exit 0
          fi

          NEW_CLI="$SDK/cmdline-tools/latest/bin/android"
          OLD_CLI="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$NEW_CLI" ]; then
            echo "Installing platform 36 with the android CLI"
            "$NEW_CLI" --sdk "$SDK" sdk install platforms/android-36 build-tools/36.0.0 || true
          elif [ -x "$OLD_CLI" ]; then
            echo "Installing platform 36 with sdkmanager"
            yes | "$OLD_CLI" --licenses > /dev/null 2>&1 || true
            "$OLD_CLI" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "No SDK manager found on the runner image; relying on what is installed."
          fi

          if [ ! -d "$SDK/platforms/android-36" ]; then
            echo "::error::platforms;android-36 is missing and could not be installed."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --continue

      - name: Lint
        run: ./gradlew lint

      # A stable signing key, when the repository has one in secrets. Without it the release
      # variant falls back to the runner's own debug keystore, and a GitHub runner is a fresh
      # VM every run: that keystore is regenerated each time, so two downloads from two runs
      # are differently signed and Android will refuse to install one over the other.
      #
      #   gh secret set THRUHIKER_KEYSTORE_BASE64 < keystore.jks.b64
      #   gh secret set THRUHIKER_KEYSTORE_PASSWORD
      #   gh secret set THRUHIKER_KEY_ALIAS
      #   gh secret set THRUHIKER_KEY_PASSWORD
      #
      # See README, "Signing".
      - name: Assemble release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.THRUHIKER_KEYSTORE_BASE64 }}
          THRUHIKER_KEYSTORE_PASSWORD: ${{ secrets.THRUHIKER_KEYSTORE_PASSWORD }}
          THRUHIKER_KEY_ALIAS: ${{ secrets.THRUHIKER_KEY_ALIAS }}
          THRUHIKER_KEY_PASSWORD: ${{ secrets.THRUHIKER_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Signing with the configured keystore"
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/thruhiker.jks"
            export THRUHIKER_KEYSTORE="${RUNNER_TEMP}/thruhiker.jks"
          else
            echo "::warning::No signing keystore in secrets, so this build is signed with the runner's debug key. That key is regenerated every run, so these APKs cannot be installed over an earlier download — see README, 'Signing'."
          fi
          ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: thruhiker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # Turns a build into something you can open on a phone. Actions artifacts need a
  # signed-in session and expire; a release asset is a plain URL.
  #
  # Two kinds of release, deliberately kept apart:
  #
  #   latest    the newest build from main, replaced on every push, assets named
  #             without the commit in them so the download URL never changes. Marked
  #             as a prerelease so it does not take the "Latest" badge.
  #   vX.Y.Z    a frozen version, assets named after the version.
  publish:
    name: Publish download
    needs: build
    # Never publish from a pull request: those commits are not on the main branch,
    # and publishing is a public invitation to install.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the built APKs
        uses: actions/download-artifact@v8
        with:
          name: thruhiker-release-apk
          path: apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          short_sha="${GITHUB_SHA:0:7}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            title="ThruHiker ${tag}"
            asset_prefix="thruhiker-${tag}"
          else
            tag="latest"
            # The date is in the title because it is the one thing that says "this is new"
            # in a releases list, where an edited release keeps announcing its first
            # publication.
            title="Latest build from main — $(date -u +%Y-%m-%d) (${short_sha})"
            # No commit in the asset names, so this URL is permanent and always serves
            # the newest build:
            #   .../releases/download/latest/thruhiker-arm64-v8a.apk
            asset_prefix="thruhiker"
          fi

          mkdir -p named
          for file in apk/*.apk; do
            base=$(basename "$file" .apk)
            abi=${base#app-}
            # Both suffixes are stripped, so the asset name does not silently change if the
            # build type does. The download URL is documented as permanent; a stray
            # `arm64-v8a-release` in it would break that without breaking the build.
            abi=${abi%-debug}
            abi=${abi%-release}
            cp "$file" "named/${asset_prefix}-${abi}.apk"
          done
          ls -la named

          cat > notes.md <<EOF
          Built from \`${GITHUB_SHA}\` on $(date -u +%Y-%m-%d).

          3D terrain is on: this build uses the vendored MapLibre SDK from the
          \`feature/terrain-3d\` branch, which is the only place terrain exists today.
          It is arm64-only, so \`${asset_prefix}-arm64-v8a.apk\` is the only build —
          install that one on any modern phone.

          Android will ask you to allow installing from an unknown source, and Play Protect
          may warn. Both are expected for a sideloaded build.

          If Android refuses to install this over an earlier ThruHiker, uninstall the old one
          first. Unless this repository has a signing keystore in its secrets, every run signs
          with its own generated debug key, and those differ from run to run — so two builds
          are not the same app as far as Android is concerned. See README, "Signing".
          EOF

          if [ "${tag}" = "latest" ]; then
            # Move the tag to the commit actually being published, so the release does
            # not drift away from the assets attached to it.
            git tag -f latest "${GITHUB_SHA}"
            git push --force origin refs/tags/latest
          fi

          # Replaced, not edited. `gh release edit` leaves `published_at` at the first
          # publication, so a rolling build rebuilt on every push kept announcing the day it
          # was first created — which is how a download from today came to display as a month
          # old. Recreating it dates it honestly.
          #
          # It is also deliberately *not* a prerelease. A prerelease is excluded from the
          # "Latest" badge, so marking the rolling build as one handed that badge to whichever
          # versioned release came last, and since a versioned release is by nature older than
          # the next push, GitHub advertised v0.1.0 from three weeks earlier as the newest thing
          # available. Publishing a version tag now takes the badge back, which is correct,
          # because a new tag is newer than the build that preceded it.
          #
          # Replacing the release also means its previous assets are gone by construction,
          # which is why there is no longer a loop here deleting them one at a time.
          if gh release view "${tag}" --repo "${repo}" > /dev/null 2>&1; then
            # --cleanup-tag=false is the default, and stated anyway: the tag must survive.
            # It is what the download URL resolves through, and recreating it here would
            # defeat the point of a permanent URL.
            gh release delete "${tag}" --repo "${repo}" --yes --cleanup-tag=false
          fi

          # No --target: the tag already points where it should in both branches, because a
          # version tag is what triggered the run and `latest` was force-moved just above.
          # --verify-tag makes that a requirement rather than an assumption, so a release can
          # never be attached to a commit on a branch instead of to the tag it names.
          gh release create "${tag}" --repo "${repo}" --verify-tag \
            --title "${title}" --notes-file notes.md

          gh release upload "${tag}" named/*.apk --repo "${repo}"
          echo "Published https://github.com/${repo}/releases/tag/${tag}"
