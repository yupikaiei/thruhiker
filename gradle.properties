# Project-wide Gradle settings.
#
# Heap is deliberately modest. A 3 GB Gradle daemon plus a Kotlin daemon plus an
# editor will exhaust an 8 GB container, and the OOM killer takes the daemon down
# mid-build with a message that says nothing about memory.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
# Enables Gradle Build Cache.
org.gradle.caching=true
# Enables Gradle Configuration Cache, the preferred Gradle execution mode.
org.gradle.configuration-cache=true
# Build independent subprojects in parallel.
org.gradle.parallel=true

# AndroidX package structure.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# Namespace each library's R class so it only contains its own resources.
android.nonTransitiveRClass=true
